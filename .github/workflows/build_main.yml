---
name: .NET
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history required for SourceLink
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore RonSijm.RepoGen.slnx --disable-parallel --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - name: Build projects
        run: dotnet build RonSijm.RepoGen.slnx --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - name: Run tests
        run: dotnet test RonSijm.RepoGen.slnx --configuration Release --no-build --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RepoGen-NuGet
          path: |
            packages/*.nupkg
            packages/*.snupkg
      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{secrets.NUGET_API_KEY}}
        run: |
          $packages = @(Get-ChildItem ./packages -Filter *.nupkg |
            Where-Object { -not $_.Name.EndsWith(".snupkg", [StringComparison]::OrdinalIgnoreCase) })

          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found to publish."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
